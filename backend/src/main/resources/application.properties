# Default profile: MySQL
# Make sure MySQL is running and a database called grievance_db exists.
# See README.md "Step 2: Backend setup" for the exact commands.

spring.datasource.url=jdbc:mysql://localhost:3306/grievance_db?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

server.port=8080

# Path to the CSV generated in Task 1 (loaded once at startup if the table is empty)
app.seed-csv-path=../data/grievances.csv

# URL of the Python prediction microservice (Task 4 / Task 5)
app.ml-service-url=http://localhost:5001/predict

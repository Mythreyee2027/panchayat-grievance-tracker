# Fallback profile: file-based H2 database, no installation needed.
# Run with:  mvn spring-boot:run -Dspring-boot.run.profiles=h2

spring.datasource.url=jdbc:h2:file:./data/grievancedb;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

server.port=8080

app.seed-csv-path=../data/grievances.csv
app.ml-service-url=http://localhost:5001/predict
